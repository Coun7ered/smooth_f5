plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

repositories {
    maven {
        url = "https://maven.midnightdust.eu/releases"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

sourceSets {
    main {
        java.srcDir("../common/src/main/java")
        resources.srcDir("../common/src/main/resources")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$rootProject.minecraft_version"

    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "eu.midnightdust:midnightlib:1.9.3+26.1-fabric"
    implementation "com.terraformersmc:modmenu:18.0.0-beta.1"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}
